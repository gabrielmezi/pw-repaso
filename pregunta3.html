<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta 3</title>
    <script src="./assets/tailwind.css"></script>
</head>
<body class="bg-slate-200 flex justify-center items-center min-h-screen">
    <article class="bg-white w-[380px] shadow-xl rounded-2xl overflow-hidden relative">
        <span class="rounded-xl bg-red-600 text-white text-xs font-bold absolute top-2 right-2 py-0.5 px-3">-20%</span>
        <img src="./assets/imagenes/pregunta3.svg">
        <p class="text-green-600 uppercase text-xs ml-4 mt-2">Audio - Accesorios</p>
        <h2 class="text-black font-bold ml-4">Audifonos inalambricos Pro X</h2>
        <div class="flex items-baseline gap-2 ml-4">
            <p class="text-black text-xl font-bold">S/. 399.90</p>
            <del class="text-gray-600 text-sm">S/. 499.90</del>
        </div>
        <p class="text-gray-500 text-sm ml-4">Cancelación activa de ruido, 30 horas de batería y carga rápida por USB-C</p>
        <ul class="flex m-4 p-1 rounded-2xl bg-gray-50">
            <li class="flex-1 text-center border-r">
                <p class="font-bold">24</p>
                <p class="uppercase text-xs">Stock</p>
            </li>
            <li class="flex-1 text-center">
                <p class="font-bold">48h</p>
                <p class="uppercase text-xs">Envío</p>
            </li>
            <li class="flex-1 text-center">
                <p class="font-bold">1 año</p>
                <p class="uppercase text-xs">Garantía</p>
            </li>
        </ul>
        <form class="p-1">
            <div class="flex gap-3 ml-4">
                <label for="cantidad" class="text-sm font-semibold text-gray-700">Cantidad</label>
                <input id="cantidad" type="number" min="1" class="border rounded-xl text-center w-20 h-5 text-xs">
            </div>
            <div class="flex p-3 gap-3">
                <button type="button" class="flex-1 py-1 font-semibold border-2 border-green-600 text-green-600 rounded-lg text-sm transition hover:scale-105 hover:bg-green-100">Añadir al carrito</button>
                <button type="button" class="flex-1 py-1 font-semibold bg-green-700 text-white rounded-lg text-sm transition hover:scale-105 hover:bg-green-600">Comprar ahora</button>
            </div>    
        </form>
    </article>
</body>
</html>
